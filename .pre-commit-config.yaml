repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        name: Gitleaks - Secrets Detection
        description: Detect secrets in git history and staged files
        entry: gitleaks git --config .gitleaks.toml --redact --verbose
        language: system
        pass_filenames: false
